name: Order Service CI/CD

on:
  push:
    branches: [  Dev ]
    paths:
      - 'Order.Api/**'
      - 'Application/**'
      - 'Data/**'
      - 'Domain/**'
      - '*.sln'
  pull_request:
    branches: [ Dev ]
    paths:
      - 'Order.Api/**'
      - 'Application/**'
      - 'Data/**'
      - 'Domain/**'
      - '*.sln'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'Order.sln'  # Adjust to your solution name
  PROJECT_PATH: 'Order.Api/Order.Api.csproj'
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore


